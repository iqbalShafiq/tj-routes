        id:
          type: integer
          example: 1
        forum_id:
          type: integer
          example: 1
        user_id:
          type: integer
          example: 2
        created_at:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00Z"
        user:
          $ref: "#/components/schemas/User"

    CreateForumPostRequest:
      type: object
      required:
        - post_type
        - title
        - content
      properties:
        post_type:
          type: string
          enum: [discussion, info, question, announcement]
