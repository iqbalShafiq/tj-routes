        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: CSV file to upload
      responses:
        "202":
          description: Upload accepted and queued for processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
              example:
                success: true
                data:
                  id: 1
                  entity_type: route
                  file_path: "./uploads/bulk_uploads/bulk_1234567890/routes.csv"
                  status: pending
                  total_rows: 0
                  success_count: 0
                  duplicate_count: 0
                  error_count: 0
                  user_id: 1
                  created_at: "2024-01-01T00:00:00Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

