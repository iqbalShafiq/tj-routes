        title:
          type: string
          example: "Route 1 Discussion"
        content:
          type: string
          example: "Let's discuss Route 1 updates"
        linked_report_id:
          type: integer
          nullable: true
          example: 5

    UpdateForumPostRequest:
      type: object
      required:
        - title
