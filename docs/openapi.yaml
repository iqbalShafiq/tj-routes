        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: postId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Post pinned successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForumPostResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      tags:
        - ForumPosts
      summary: Unpin forum post
      description: Unpin a forum post (Admin only)
      operationId: unpinForumPost
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: postId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Post unpinned successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForumPostResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/forum-posts/{id}/comments:
    get:
      tags:
        - Comments
      summary: Get comments for a forum post
      description: Get all threaded comments for a specific forum post
      operationId: getForumPostComments
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of comments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags:
        - Comments
      summary: Add comment to forum post
      description: Add a comment to a forum post (can be a reply to another comment)
      operationId: createForumPostComment
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommentRequest"
      responses:
        "201":
          description: Comment created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/forum-posts/{id}/react:
    post:
      tags:
        - Reactions
      summary: React to a forum post
      description: Add or toggle an upvote/downvote reaction on a forum post
      operationId: reactToForumPost
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReactRequest"
      responses:
        "200":
          description: Reaction updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags:
        - Reactions
      summary: Remove reaction from forum post
      description: Remove your reaction from a forum post
      operationId: removeForumPostReaction
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Reaction removed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/bulk-upload/{entityType}:
    post:
      tags:
        - BulkUpload
      summary: Upload CSV file for bulk import
      description: Upload a CSV file to bulk import routes, stops, or vehicles. The file is processed asynchronously in the background. Returns immediately with upload ID and status.
      operationId: uploadBulkCSV
      security:
        - bearerAuth: []
      parameters:
        - name: entityType
          in: path
          required: true
          description: Type of entity to import
          schema:
            type: string
            enum: [route, stop, vehicle]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: CSV file to upload
      responses:
        "202":
          description: Upload accepted and queued for processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkUploadResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/bulk-upload/{id}:
    get:
      tags:
        - BulkUpload
      summary: Get bulk upload status
      description: Get the current status and progress of a bulk upload operation
      operationId: getBulkUploadStatus
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Upload status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkUploadResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/bulk-upload:
    get:
      tags:
        - BulkUpload
      summary: List bulk uploads
      description: List all bulk upload operations with optional filters
      operationId: listBulkUploads
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: entity_type
          in: query
          schema:
            type: string
            enum: [route, stop, vehicle]
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, processing, completed, failed]
        - name: user_id
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of bulk uploads
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkUploadListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from login endpoint

  schemas:
    RegisterRequest:
      type: object
      required:
        - email
        - username
        - password
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        username:
          type: string
          minLength: 3
          maxLength: 50
          example: johndoe
        password:
          type: string
          format: password
          minLength: 6
          example: password123

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          example: password123

    LoginResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        access_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        refresh_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        email:
          type: string
          format: email
          example: user@example.com
        username:
          type: string
          example: johndoe
        role:
          type: string
          enum: [common_user, admin]
          example: common_user
        oauth_provider:
          type: string
          nullable: true
          example: google
        oauth_id:
          type: string
          nullable: true
        reputation_points:
          type: integer
          default: 0
          example: 150
        level:
          type: string
          enum: [newcomer, contributor, trusted, expert, legend]
          default: newcomer
          example: contributor
        created_at:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00Z"
        updated_at:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00Z"

    Stop:
      type: object
      required:
        - name
        - type
        - latitude
        - longitude
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Halte Bundaran HI
        type:
          type: string
          enum: [stop, terminal]
          example: stop
        latitude:
          type: number
          format: double
          example: -6.1944
        longitude:
          type: number
          format: double
          example: 106.8229
        address:
          type: string
          example: Jl. Jend. Sudirman, Jakarta
        city:
          type: string
          example: Jakarta Pusat
        district:
          type: string
          example: Menteng
        facilities:
          type: string
          nullable: true
          example: '["shelter", "bench", "lighting"]'
        status:
          type: string
          enum: [active, inactive]
          default: active
          example: active
        photo_url:
          type: string
          nullable: true
          description: URL of the stop photo
          example: "http://localhost:8080/uploads/stops/1/photo_1234567890.jpg"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Route:
      type: object
      required:
        - route_number
        - name
      properties:
        id:
          type: integer
          example: 1
        route_number:
          type: string
          example: "1"
        name:
          type: string
          example: Blok M - Kota
        description:
          type: string
          example: Route from Blok M to Kota
        status:
          type: string
          enum: [active, inactive]
          default: active
          example: active
        route_stops:
          type: array
          items:
            $ref: "#/components/schemas/RouteStop"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    RouteStop:
      type: object
      properties:
        id:
          type: integer
        route_id:
          type: integer
        stop_id:
          type: integer
        sequence_order:
          type: integer
        stop:
          $ref: "#/components/schemas/Stop"

    CreateRouteRequest:
      type: object
      required:
        - route_number
        - name
        - stop_ids
      properties:
        route_number:
          type: string
          example: "1"
        name:
          type: string
          example: Blok M - Kota
        description:
          type: string
          example: Route from Blok M to Kota
        status:
          type: string
          enum: [active, inactive]
          default: active
        stop_ids:
          type: array
          items:
            type: integer
          minItems: 2
          example: [1, 2, 3, 4]

    UpdateRouteStopsRequest:
      type: object
      required:
        - stop_ids
      properties:
        stop_ids:
          type: array
          items:
            type: integer
          minItems: 2
          example: [1, 2, 3, 4, 5]

    Vehicle:
      type: object
      required:
        - vehicle_plate
        - route_id
      properties:
        id:
          type: integer
          example: 1
        vehicle_plate:
          type: string
          example: B1234XYZ
        route_id:
          type: integer
          example: 1
        vehicle_type:
          type: string
          example: Bus
        capacity:
          type: integer
          example: 60
        status:
          type: string
          enum: [active, inactive]
          default: active
          example: active
        photo_url:
          type: string
          nullable: true
          description: URL of the vehicle photo
          example: "http://localhost:8080/uploads/vehicles/1/photo_1234567890.jpg"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Report:
      type: object
      required:
        - type
        - title
        - description
      properties:
        id:
          type: integer
          example: 1
        user_id:
          type: integer
          example: 1
        type:
          type: string
          enum: [route_issue, stop_issue, temporary_event, policy_change]
          example: route_issue
        title:
          type: string
          example: Route 1 is delayed
        description:
          type: string
          example: Route 1 has been experiencing delays during rush hour
        related_route_id:
          type: integer
          nullable: true
          example: 1
        related_stop_id:
          type: integer
          nullable: true
          example: 2
        status:
          type: string
          enum: [pending, reviewed, resolved]
          default: pending
          example: pending
        category:
          type: string
          nullable: true
          description: Category of the report (can be predefined or custom)
          example: Crash
        admin_notes:
          type: string
          nullable: true
          example: Investigating the issue
        photo_urls:
          type: array
          items:
            type: string
          nullable: true
          description: Array of photo URLs
          example:
            ["http://localhost:8080/uploads/reports/1/photo_1234567890.jpg"]
        pdf_urls:
          type: array
          items:
            type: string
          nullable: true
          description: Array of PDF document URLs
          example:
            ["http://localhost:8080/uploads/reports/1/document_1234567890.pdf"]
        upvotes:
          type: integer
          default: 0
          example: 15
        downvotes:
          type: integer
          default: 0
          example: 2
        comment_count:
          type: integer
          default: 0
          example: 8
        hashtags:
          type: array
          items:
            type: string
          nullable: true
          description: Array of hashtag names (without #)
          example: ["route1", "delay", "rushhour"]
        is_following:
          type: boolean
          nullable: true
          description: Whether the current user follows the report author (only present if authenticated)
        user_reaction:
          type: string
          nullable: true
          enum: [upvote, downvote]
          description: Current user's reaction to this report (only present if authenticated)
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UpdateReportStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [pending, reviewed, resolved]
          example: reviewed
        admin_notes:
          type: string
          nullable: true
          example: Issue has been resolved

    ReportCategory:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Crash
        description:
          type: string
          nullable: true
          example: Vehicle accidents or crashes
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateCategoryRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: Crash
        description:
          type: string
          nullable: true
          example: Vehicle accidents or crashes

    UpdateUserRoleRequest:
      type: object
      required:
        - role
      properties:
        role:
          type: string
          enum: [common_user, admin]
          example: admin

    Comment:
      type: object
      properties:
        id:
          type: integer
          example: 1
        report_id:
          type: integer
          example: 1
        user_id:
          type: integer
          example: 2
        parent_id:
          type: integer
          nullable: true
          description: ID of parent comment for threaded replies
          example: null
        content:
          type: string
          example: "Great report! This is very helpful."
        upvotes:
          type: integer
          default: 0
          example: 5
        downvotes:
          type: integer
          default: 0
          example: 0
        created_at:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00Z"
        updated_at:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00Z"
        user:
          $ref: "#/components/schemas/User"
        replies:
          type: array
          items:
            $ref: "#/components/schemas/Comment"
          description: Child comments (replies)

    CreateCommentRequest:
      type: object
      required:
        - content
      properties:
        content:
          type: string
          minLength: 1
          example: "This is a helpful comment"
        parent_id:
          type: integer
          nullable: true
          description: ID of parent comment if this is a reply
          example: null

    UpdateCommentRequest:
      type: object
      required:
        - content
      properties:
        content:
          type: string
          minLength: 1
          example: "Updated comment content"

    Reaction:
      type: object
      properties:
        id:
          type: integer
          example: 1
        user_id:
          type: integer
          example: 1
        target_type:
          type: string
          enum: [report, comment, forum_post]
          example: report
        target_id:
          type: integer
          example: 1
        reaction_type:
          type: string
          enum: [upvote, downvote]
          example: upvote
        created_at:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00Z"

    Forum:
      type: object
      properties:
        id:
          type: integer
          example: 1
        route_id:
          type: integer
          example: 1
        created_at:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00Z"
        updated_at:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00Z"
        route:
          $ref: "#/components/schemas/Route"

    ForumPost:
      type: object
      required:
        - post_type
        - title
        - content
      properties:
        id:
          type: integer
          example: 1
        forum_id:
          type: integer
          example: 1
        user_id:
          type: integer
          example: 2
        post_type:
          type: string
          enum: [discussion, info, question, announcement]
          example: discussion
        title:
          type: string
          example: "Route 1 Discussion"
        content:
          type: string
          example: "Let's discuss Route 1 updates and issues"
        linked_report_id:
          type: integer
          nullable: true
