components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from login endpoint

  schemas:
    RegisterRequest:
      type: object
      required:
        - email
        - username
        - password
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        username:
          type: string
          minLength: 3
          maxLength: 50
          example: johndoe
        password:
          type: string
          format: password
          minLength: 6
          example: password123

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          example: password123

    LoginResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        access_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        refresh_token:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...

    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        email:
          type: string
          format: email
          example: user@example.com
        username:
          type: string
          example: johndoe
        role:
          type: string
          enum: [common_user, admin]
          example: common_user
        oauth_provider:
          type: string
          nullable: true
          example: google
        oauth_id:
          type: string
          nullable: true
        reputation_points:
          type: integer
          default: 0
          example: 150
        level:
          type: string
          enum: [newcomer, contributor, trusted, expert, legend]
          default: newcomer
          example: contributor
        created_at:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00Z"
        updated_at:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00Z"

    Stop:
      type: object
      required:
        - name
        - type
        - latitude
        - longitude
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Halte Bundaran HI
        type:
          type: string
          enum: [stop, terminal]
          example: stop
        latitude:
          type: number
          format: double
          example: -6.1944
        longitude:
          type: number
          format: double
          example: 106.8229
        address:
          type: string
          example: Jl. Jend. Sudirman, Jakarta
        city:
          type: string
          example: Jakarta Pusat
        district:
          type: string
          example: Menteng
        facilities:
          type: string
          nullable: true
          example: '["shelter", "bench", "lighting"]'
        status:
          type: string
          enum: [active, inactive]
          default: active
          example: active
        photo_url:
          type: string
          nullable: true
          description: URL of the stop photo
          example: "http://localhost:8080/uploads/stops/1/photo_1234567890.jpg"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Route:
      type: object
      required:
        - route_number
        - name
      properties:
        id:
          type: integer
          example: 1
        route_number:
          type: string
          example: "1"
        name:
          type: string
          example: Blok M - Kota
        description:
          type: string
          example: Route from Blok M to Kota
        status:
          type: string
