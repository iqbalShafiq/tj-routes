          example: 5
        is_pinned:
          type: boolean
          default: false
          example: false
        photo_urls:
          type: array
          items:
            type: string
          nullable: true
          description: Array of photo URLs
          example:
            ["http://localhost:8080/uploads/forum-posts/1/photo_1234567890.jpg"]
        pdf_urls:
          type: array
          items:
            type: string
          nullable: true
          description: Array of PDF document URLs
          example:
            [
              "http://localhost:8080/uploads/forum-posts/1/document_1234567890.pdf",
            ]
        upvotes:
          type: integer
          default: 0
          example: 10
        downvotes:
          type: integer
          default: 0
          example: 1
        comment_count:
          type: integer
          default: 0
          example: 5
        created_at:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00Z"
        updated_at:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00Z"
        user:
          $ref: "#/components/schemas/User"
        forum:
          $ref: "#/components/schemas/Forum"
        linked_report:
