                  success_count: 45
                  duplicate_count: 5
                  error_count: 0
                  last_processed_row: 50
                  created_at: "2024-01-01T00:00:00Z"
                  updated_at: "2024-01-01T00:05:00Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
