openapi: 3.1.0
info:
  title: TransJakarta Routes API
  description: |
    A RESTful API application built with Go (Gin framework) to manage TransJakarta BRT route information, stops/terminals, vehicles, and user reports.

    ## Features
    - User Authentication (Email/Password and OAuth)
    - Guest Access (read-only routes, stops, vehicles; create reports)
    - Role-Based Access Control (Common users and Admins)
    - Route Management
    - Stop/Terminal Management
    - Vehicle Management
    - Reporting System
    - Social Media Features (Public Feed, Hashtags, User Following, Trending, Stories)
  version: 1.0.0
  contact:
    name: API Support
  license:
    name: MIT

servers:
  - url: http://localhost:8080
    description: Local development server
  - url: https://api.example.com
    description: Production server

tags:
  - name: Authentication
    description: User authentication endpoints
  - name: Stops
    description: Stop/Terminal management
  - name: Routes
    description: Route management
  - name: Vehicles
    description: Vehicle management
  - name: Reports
    description: User reports management
  - name: Users
    description: User management (Admin only)
  - name: BulkUpload
    description: Bulk CSV upload for routes, stops, and vehicles (Admin only)
  - name: Comments
    description: Comment management for reports
  - name: Reactions
    description: Upvote/downvote reactions on reports and comments
  - name: Leaderboard
    description: User leaderboard and reputation system
  - name: Badges
    description: Achievement badges system
  - name: Hashtags
    description: Hashtag management and trending hashtags
  - name: UserFollows
    description: User follow/unfollow functionality
  - name: Health
    description: Health check endpoint

paths:
  /health:
    get:
      tags:
        - Health
      summary: Health check
      description: Check if the API is running
      operationId: healthCheck
      responses:
        "200":
          description: API is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /api/v1/auth/register:
    post:
      tags:
        - Authentication
      summary: Register new user
      description: Register a new user with email and password
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
              example:
                success: true
                data:
                  id: 1
                  email: user@example.com
                  username: johndoe
                  role: common_user
                  created_at: "2024-01-01T00:00:00Z"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/auth/login:
    post:
      tags:
        - Authentication
      summary: Login with email/password
      description: Authenticate user and receive JWT tokens
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/oauth/{provider}:
    get:
      tags:
        - Authentication
      summary: Initiate OAuth flow
      description: Redirect to OAuth provider (Google)
      operationId: oauthInitiate
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [google]
      responses:
        "302":
          description: Redirect to OAuth provider

  /api/v1/auth/oauth/{provider}/callback:
    get:
      tags:
        - Authentication
      summary: OAuth callback
      description: Handle OAuth callback and authenticate user
      operationId: oauthCallback
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [google]
        - name: code
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OAuth authentication successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/stops:
    get:
      tags:
        - Stops
      summary: List all stops
      description: Get paginated list of stops with optional filters. **Guest accessible** (authentication optional)
      operationId: listStops
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: status
          in: query
          schema:
            type: string
            enum: [active, inactive]
        - name: type
          in: query
          schema:
            type: string
            enum: [stop, terminal]
        - name: city
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of stops
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StopListResponse"
    post:
      tags:
        - Stops
      summary: Create stop
      description: Create a new stop (Admin only). Supports both JSON-only and multipart/form-data with photo upload.
      operationId: createStop
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                data:
                  type: string
                  description: JSON string of stop data
                  example: '{"name":"Halte Bundaran HI","type":"stop","latitude":-6.1944,"longitude":106.8229}'
                photo:
                  type: string
                  format: binary
                  description: "Photo file (optional). Allowed types: image/jpeg, image/png, image/webp, image/gif. Max size: 5MB"
            example:
              data: '{"name":"Halte Bundaran HI","type":"stop","latitude":-6.1944,"longitude":106.8229}'
              photo: ""
      responses:
        "201":
          description: Stop created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/stops/{id}:
    get:
      tags:
        - Stops
      summary: Get stop by ID
      description: Get detailed information about a specific stop. **Guest accessible** (authentication optional)
      operationId: getStop
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Stop details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags:
        - Stops
      summary: Update stop
      description: Update stop information (Admin only). Supports both JSON-only and multipart/form-data with photo upload.
      operationId: updateStop
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                data:
                  type: string
                  description: JSON string of stop data
                  example: '{"name":"Halte Bundaran HI Updated","type":"stop","latitude":-6.1944,"longitude":106.8229}'
                photo:
                  type: string
                  format: binary
                  description: "Photo file (optional). Allowed types: image/jpeg, image/png, image/webp, image/gif. Max size: 5MB"
            example:
              data: '{"name":"Halte Bundaran HI Updated","type":"stop","latitude":-6.1944,"longitude":106.8229}'
              photo: ""
      responses:
        "200":
          description: Stop updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      tags:
        - Stops
      summary: Delete stop
      description: Delete a stop (Admin only)
      operationId: deleteStop
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Stop deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/routes:
    get:
      tags:
        - Routes
      summary: List all routes
      description: Get paginated list of routes with optional filters. **Guest accessible** (authentication optional). Supports fuzzy search with typo tolerance.
      operationId: listRoutes
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: status
          in: query
          schema:
            type: string
            enum: [active, inactive]
        - name: route_number
          in: query
          schema:
            type: string
        - name: search
          in: query
          description: Fuzzy search term to match against route name, route number, or description. Supports typo tolerance.
          schema:
            type: string
          example: "jakrta"
      responses:
        "200":
          description: List of routes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteListResponse"
    post:
      tags:
        - Routes
      summary: Create route
      description: Create a new route with stops (Admin only)
      operationId: createRoute
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRouteRequest"
      responses:
        "201":
          description: Route created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/routes/{id}:
    get:
      tags:
        - Routes
      summary: Get route by ID
      description: Get detailed information about a specific route with stops. **Guest accessible** (authentication optional)
      operationId: getRoute
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Route details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags:
        - Routes
      summary: Update route
      description: Update route metadata (Admin only)
      operationId: updateRoute
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Route"
      responses:
        "200":
          description: Route updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      tags:
        - Routes
      summary: Delete route
      description: Delete a route (Admin only)
      operationId: deleteRoute
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Route deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/routes/{id}/stops:
    put:
      tags:
        - Routes
      summary: Update route stops
      description: Update the stops for a route (Admin only)
      operationId: updateRouteStops
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRouteStopsRequest"
      responses:
        "200":
          description: Route stops updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/vehicles:
    get:
      tags:
        - Vehicles
      summary: List all vehicles
      description: Get paginated list of vehicles with optional filters. **Guest accessible** (authentication optional). Supports fuzzy search with typo tolerance.
      operationId: listVehicles
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: status
          in: query
          schema:
            type: string
            enum: [active, inactive]
        - name: route_id
          in: query
          schema:
            type: integer
        - name: search
          in: query
          description: Fuzzy search term to match against vehicle plate or vehicle type. Supports typo tolerance.
          schema:
            type: string
          example: "B1234"
      responses:
        "200":
          description: List of vehicles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VehicleListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags:
        - Vehicles
      summary: Create vehicle
      description: Create a new vehicle (Admin only). Supports both JSON-only and multipart/form-data with photo upload.
      operationId: createVehicle
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                data:
                  type: string
                  description: JSON string of vehicle data
                  example: '{"vehicle_plate":"B1234XYZ","route_id":1,"vehicle_type":"Bus","capacity":60}'
                photo:
                  type: string
                  format: binary
                  description: "Photo file (optional). Allowed types: image/jpeg, image/png, image/webp, image/gif. Max size: 5MB"
      responses:
        "201":
          description: Vehicle created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/vehicles/{id}:
    get:
      tags:
        - Vehicles
      summary: Get vehicle by ID
      description: Get detailed information about a specific vehicle. **Guest accessible** (authentication optional)
      operationId: getVehicle
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Vehicle details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags:
        - Vehicles
      summary: Update vehicle
      description: Update vehicle information (Admin only). Supports both JSON-only and multipart/form-data with photo upload.
      operationId: updateVehicle
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                data:
                  type: string
                  description: JSON string of vehicle data
                  example: '{"vehicle_plate":"B1234XYZ","route_id":1,"vehicle_type":"Bus","capacity":60}'
                photo:
                  type: string
                  format: binary
                  description: "Photo file (optional). Allowed types: image/jpeg, image/png, image/webp, image/gif. Max size: 5MB"
            example:
              data: '{"vehicle_plate":"B1234XYZ","route_id":1,"vehicle_type":"Bus","capacity":60}'
              photo: ""
          application/json:
            schema:
              $ref: "#/components/schemas/Vehicle"
      responses:
        "200":
          description: Vehicle updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      tags:
        - Vehicles
      summary: Delete vehicle
      description: Delete a vehicle (Admin only)
      operationId: deleteVehicle
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Vehicle deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/reports:
    get:
      tags:
        - Reports
      summary: List reports
      description: Get paginated list of reports (users see only their own, admins see all). Supports fuzzy search with typo tolerance.
      operationId: listReports
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, reviewed, resolved]
        - name: type
          in: query
          schema:
            type: string
            enum: [route_issue, stop_issue, temporary_event, policy_change]
        - name: category
          in: query
          schema:
            type: string
          description: Filter by category name
        - name: search
          in: query
          description: Fuzzy search term to match against report title or description. Supports typo tolerance.
          schema:
            type: string
          example: "delay"
      responses:
        "200":
          description: List of reports
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags:
        - Reports
      summary: Create report
      description: Create a new report. **Guest accessible** (authentication optional, guest reports are assigned to system user account). Authenticated users' reports are assigned to their own account. Supports both JSON-only and multipart/form-data with photo and PDF uploads.
      operationId: createReport
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                data:
                  type: string
                  description: JSON string of report data
                  example: '{"type":"route_issue","title":"Route 1 is delayed","description":"Route 1 has been experiencing delays","category":"Crash"}'
                photos:
                  type: string
                  format: binary
                  description: "Photo files (optional, multiple files can be uploaded by using the same field name multiple times). Allowed types: image/jpeg, image/png, image/webp, image/gif. Max size: 5MB per file"
                pdfs:
                  type: string
                  format: binary
                  description: "PDF files (optional, multiple files can be uploaded by using the same field name multiple times). Allowed type: application/pdf. Max size: 10MB per file"
            example:
              data: '{"type":"route_issue","title":"Route 1 is delayed","description":"Route 1 has been experiencing delays"}'
              photos: ""
              pdfs: ""
      responses:
        "201":
          description: Report created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/reports/{id}:
    get:
      tags:
        - Reports
      summary: Get report by ID
      description: Get detailed information about a specific report
      operationId: getReport
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Report details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags:
        - Reports
      summary: Delete report
      description: Delete a report (Admin only)
      operationId: deleteReport
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Report deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/reports/feed:
    get:
      tags:
        - Reports
      summary: Get public feed
      description: Get public feed of reports with sorting and filtering options. **Guest accessible** (authentication optional). Supports sorting by recent, popular, or trending. Can filter by hashtags and followed users.
      operationId: getPublicFeed
      parameters:
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: sort
          in: query
          schema:
            type: string
            enum: [recent, popular, trending]
            default: recent
          description: Sort order for reports
        - name: hashtag
          in: query
          schema:
            type: string
          description: Filter by hashtag name (without #)
        - name: followed
          in: query
          schema:
            type: string
            enum: ["true", "false"]
          description: Show only reports from followed users (requires authentication)
        - name: category
          in: query
          schema:
            type: string
          description: Filter by category name
      responses:
        "200":
          description: Feed of reports
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/reports/trending:
    get:
      tags:
        - Reports
      summary: Get trending reports
      description: Get trending reports based on engagement metrics and recency. **Guest accessible** (authentication optional).
      operationId: getTrendingReports
      parameters:
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: window
          in: query
          schema:
            type: string
            enum: [1h, 24h, 7d, 30d, all]
            default: 24h
          description: Time window for trending calculation
      responses:
        "200":
          description: Trending reports
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrendingResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/reports/stories:
    get:
      tags:
        - Reports
      summary: Get stories
      description: Get recent reports with photos (stories). **Guest accessible** (authentication optional). Returns reports with photos from the last 24 hours.
      operationId: getStories
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
          description: Maximum number of stories to return
        - name: user_id
          in: query
          schema:
            type: integer
          description: Filter stories by specific user ID
      responses:
        "200":
          description: Stories list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoriesResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/reports/{id}/status:
    put:
      tags:
        - Reports
      summary: Update report status
      description: Update report status and admin notes (Admin only)
      operationId: updateReportStatus
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateReportStatusRequest"
      responses:
        "200":
          description: Report status updated successfully
          content:
            application/json:
              schema:
