    RouteListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            routes:
              type: array
              items:
                $ref: "#/components/schemas/Route"
            total:
              type: integer
              example: 50
            page:
              type: integer
              example: 1
            limit:
              type: integer
              example: 10

    VehicleListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            vehicles:
              type: array
              items:
                $ref: "#/components/schemas/Vehicle"
            total:
              type: integer
              example: 200
            page:
              type: integer
              example: 1
            limit:
              type: integer
              example: 10

    ReportListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
